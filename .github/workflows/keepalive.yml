name: TeleAgent 云电脑保活

on:
  schedule:
    # 每 25 分钟一轮（UTC）：休眠阈值 1 小时，留足余量给调度延迟与平台策略动态调整。
    # 非整点间隔 + 脚本内 0~45s 随机抖动，降低机械心跳特征。
    # 注：本机实测 GitHub 自带 schedule 曾出现平台级不触发，实际以外部 cron-job.org
    #     调用 workflow_dispatch 为准；此处保留作双保险。
    - cron: '*/25 * * * *'
  workflow_dispatch: # 外部 cron-job.org 每 25 分钟调用一次 + 手动验证

# 防止上一轮没跑完就并发触发
concurrency:
  group: teleagent-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 恢复 JWT 缓存
        uses: actions/cache@v4
        with:
          # 只缓存 jwt.txt 免重复登录；密码不落盘、不入缓存。
          # 积分防重复靠服务端 checkTask 幂等（action_status=completed），
          # 不依赖本地标记文件——故 path 保持单文件，历史 v1 缓存可直接恢复。
          path: data/jwt.txt
          key: teleagent-jwt-v1-${{ github.run_id }}
          # 前缀匹配恢复最近一次运行保存的 JWT（含最新凭据）
          restore-keys: |
            teleagent-jwt-v1-

      - name: 执行一轮保活
        env:
          TA_ACCOUNT: ${{ secrets.TA_ACCOUNT }}
          TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
        run: node actions-keepalive.js
        # 缓存由 actions/cache 在 job 成功结束时自动保存：
        # 本轮若重登更新了 jwt.txt，新 JWT 会写入新的 run_id 缓存条目。
