name: TeleAgent 云电脑保活

on:
  # 调度全部交给外部 cron-job.org，通过 POST workflow_dispatch 触发。
  # 已移除 GitHub 内置 schedule：cron '*/25' 在每小时 00/25/50 分触发，
  # 50 分到下一小时 00 分只有 10 分钟，与 cron-job.org 叠加后间隔忽 25 忽 10，
  # 反而制造了机械噪声。外部单一触发源 + 脚本内 0~45s 抖动即可。
  workflow_dispatch: # cron-job.org 触发 + 手动验证

permissions:
  contents: read
  actions: write # 允许每轮清理旧缓存，防止缓存条目无限膨胀

# 防止上一轮没跑完就并发触发
concurrency:
  group: teleagent-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 上限需覆盖「失败轮 + 3 分钟重试等待 + 补跑轮」最坏路径；
    # 正常轮次按实际秒数计费，调高不影响额度。
    timeout-minutes: 12
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 恢复 JWT 缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          # 缓存整个 data/：账号1 的 jwt.txt + 账号2/3... 的 data/accN/jwt.txt。
          # 密码不落盘、不入缓存。积分防重复靠服务端 checkTask 幂等。
          # key 用 run_id 保证每轮可写入新条目；下方每轮清理旧条目，稳定控制在 6 个内。
          path: data/
          key: teleagent-jwt-v1-${{ github.run_id }}
          restore-keys: |
            teleagent-jwt-v1-

      - name: 执行一轮保活
        env:
          # 账号1（兼容旧命名）
          TA_ACCOUNT: ${{ secrets.TA_ACCOUNT }}
          TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
          # 账号2~5（按需增加，编号须连续；加账号只需加 Secrets，不用改本文件）
          TA_ACCOUNT_2: ${{ secrets.TA_ACCOUNT_2 }}
          TA_PASSWORD_2: ${{ secrets.TA_PASSWORD_2 }}
          TA_ACCOUNT_3: ${{ secrets.TA_ACCOUNT_3 }}
          TA_PASSWORD_3: ${{ secrets.TA_PASSWORD_3 }}
          TA_ACCOUNT_4: ${{ secrets.TA_ACCOUNT_4 }}
          TA_PASSWORD_4: ${{ secrets.TA_PASSWORD_4 }}
          TA_ACCOUNT_5: ${{ secrets.TA_ACCOUNT_5 }}
          TA_PASSWORD_5: ${{ secrets.TA_PASSWORD_5 }}
        run: node actions-keepalive.js

      # 守门：仅当脚本写出 .cache-ok（本轮至少 1 账号成功）才保存。
      # 用 actions/cache/save@v4 + if 条件（save-if 不是合法参数，2026-11-27 踩坑）。
      # 失败轮绝不保存 data/，避免空/残缺 JWT 入缓存污染后续轮次。
      - name: 保存 JWT 缓存（仅成功轮）
        if: hashFiles('data/.cache-ok') != ''
        uses: actions/cache/save@v4
        with:
          path: data/
          key: teleagent-jwt-v1-${{ github.run_id }}

      # 每轮清理旧缓存，只保留最近 6 个（含本轮刚保存的）。
      # 根因：此前每轮用 run_id 建新 key 却从不删除，累积到 349 个，
      # GitHub 超限后 restore 直接 Cache not found → 每轮被迫重登 → 境外 IP 拿不到
      # operationToken → 保活全线失败 → 云电脑关机（2026-11-27 事故）。
      - name: 清理旧缓存（保留最近 6 个）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CACHES=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches | sort_by(.created_at) | reverse | .[] | "\(.id) \(.key)"' 2>/dev/null || true)
          echo "$CACHES" | tail -n +7 | while read -r id key; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null 2>&1 && echo "已删旧缓存 $key" || true
          done
          echo "剩余缓存数: $(echo "$CACHES" | grep -c . || echo 0)"
