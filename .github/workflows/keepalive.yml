name: TeleAgent 云电脑保活

on:
  schedule:
    # 每 25 分钟一轮（UTC）：休眠阈值 1 小时，留足余量给调度延迟与平台策略动态调整。
    # 非整点间隔 + 脚本内 0~45s 随机抖动，降低机械心跳特征。
    # 注：本机实测 GitHub 自带 schedule 曾出现平台级不触发，实际以外部 cron-job.org
    #     调用 workflow_dispatch 为准；此处保留作双保险。
    - cron: '*/25 * * * *'
  workflow_dispatch: # 外部 cron-job.org 每 25 分钟调用一次 + 手动验证

# 防止上一轮没跑完就并发触发
concurrency:
  group: teleagent-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 恢复会话与积分状态缓存
        uses: actions/cache@v4
        with:
          # jwt.txt 免重复登录；claim-state.json 保证每日积分只领一次
          # 密码不落盘、不入缓存
          path: |
            data/jwt.txt
            data/claim-state.json
          # 滚动 key：每轮用当前 run_id 建新条目，保存最新状态
          key: teleagent-state-v2-${{ github.run_id }}
          # 前缀匹配恢复最近一次运行保存的状态
          restore-keys: |
            teleagent-state-v2-

      - name: 执行一轮保活
        env:
          TA_ACCOUNT: ${{ secrets.TA_ACCOUNT }}
          TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
        run: node actions-keepalive.js
        # 缓存由 actions/cache 在 job 成功结束时自动保存：
        # 本轮若重登更新了 jwt.txt，新 JWT 会写入新的 run_id 缓存条目。
