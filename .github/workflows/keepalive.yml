name: TeleAgent 云电脑保活

on:
  # 调度全部交给外部 cron-job.org，通过 POST workflow_dispatch 触发。
  # 已移除 GitHub 内置 schedule：cron '*/25' 在每小时 00/25/50 分触发，
  # 50 分到下一小时 00 分只有 10 分钟，与 cron-job.org 叠加后间隔忽 25 忽 10，
  # 反而制造了机械噪声。外部单一触发源 + 脚本内 0~45s 抖动即可。
  workflow_dispatch: # cron-job.org 触发 + 手动验证

# 防止上一轮没跑完就并发触发
concurrency:
  group: teleagent-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 上限需覆盖「失败轮 + 3 分钟重试等待 + 补跑轮」最坏路径；
    # 正常轮次按实际秒数计费，调高不影响额度。
    timeout-minutes: 12
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 恢复 JWT 缓存
        uses: actions/cache@v4
        with:
          # 只缓存 jwt.txt 免重复登录；密码不落盘、不入缓存。
          # 积分防重复靠服务端 checkTask 幂等（action_status=completed），
          # 不依赖本地标记文件——故 path 保持单文件，历史 v1 缓存可直接恢复。
          path: data/jwt.txt
          key: teleagent-jwt-v1-${{ github.run_id }}
          # 前缀匹配恢复最近一次运行保存的 JWT（含最新凭据）
          restore-keys: |
            teleagent-jwt-v1-

      - name: 执行一轮保活
        env:
          TA_ACCOUNT: ${{ secrets.TA_ACCOUNT }}
          TA_PASSWORD: ${{ secrets.TA_PASSWORD }}
        run: node actions-keepalive.js
        # 缓存由 actions/cache 在 job 成功结束时自动保存：
        # 本轮若重登更新了 jwt.txt，新 JWT 会写入新的 run_id 缓存条目。
